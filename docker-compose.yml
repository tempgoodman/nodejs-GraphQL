version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-subgraph:
    build: ./product-subgraph
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "sleep 10 && npm run start"
    depends_on:
      redis:
        condition: service_started

  order-subgraph:
    build: ./order-subgraph
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRODUCTS_SUBGRAPH_URL=http://product-subgraph:4001/graphql
    command: sh -c "sleep 10 && npm run start"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  xapi-gateway:
    build: ./xapi-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    depends_on:
      - product-subgraph
      - order-subgraph

volumes:
  redis-data:
  rabbitmq-data: